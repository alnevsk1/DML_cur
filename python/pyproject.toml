[project]
name = "dml-cur"
version = "0.1.0"
description = "Курсовая: сегментационный трекинг объектов (БпЛА) — бенчмарк моделей и экспорт в ONNX (WSL2)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # PyTorch 2.14 + CUDA 13.0 (docs/versions.md). torchvision 0.29.0 требует ровно torch==2.14.0.
    "torch==2.14.0",
    "torchvision==0.29.0",
    "numpy>=2.0",
    # Та же версия OpenCV, что в C++-части: одинаковые ресайз/декодирование кадров для сравнения масок.
    "opencv-python-headless==4.14.0.94",
    "pillow>=11.0",
    # Экспорт и проверка ONNX. Для TensorRT 10.16 экспортировать с opset <= 24.
    "onnx>=1.20,<1.21", 
    "onnxscript>=0.5",          # нужен dynamo-экспортёру torch.onnx
    "onnxslim>=0.1.90",
    "onnxruntime-gpu>=1.30,<1.31",  # с 1.27 wheel на PyPI собран под CUDA 13.0
    # Маски AeroVIS (COCO RLE) — эталонная реализация декодирования/кодирования
    "pycocotools==2.0.11",
    # Зависимости кода моделей из third_party/ (сами репозитории НЕ устанавливаются как пакеты:
    # EdgeTAM и SAM 2 оба называют пакет `sam2`, EfficientTAM тянет gradio и opencv-python).
    # Версии — как закреплены авторами (EfficientTAM requirements.txt, EdgeTAM setup.py).
    "hydra-core==1.3.2",  # конфиги SAM 2 / EfficientTAM / EdgeTAM / Cutie
    "iopath==0.1.10",
    "timm==1.0.15",       # RepViT-энкодер EdgeTAM
    # Бенчмарк и отчёты
    "pandas>=2.2",
    "pyarrow>=18.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.3",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
# Python-часть живёт только в WSL2 (Ubuntu x86_64) — lock-файл резолвится только под неё.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
